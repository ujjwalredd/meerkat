# Wrap an AI coding agent (Claude Code, Codex, Aider, Goose) with
# scoped autonomy. Auto-approves the agent process + safe test commands;
# everything else asks. Sandbox + egress proxy opt-in.
#
# Generate via:  meerkat init --profile=agent
version: 1
project:
  name: my-project
  root: .
mode:
  default_action: ask
  auto_approve_safe_actions: true
  deny_out_of_scope: true
awake:
  enabled: true
  mode: while_command_running
  max_duration_minutes: 240
filesystem:
  allowed_read_paths: [.]
  allowed_write_paths: [./src, ./tests, ./docs, ./README.md]
  blocked_paths:
    - ./.env
    - ./.env.*
    - ./secrets
    - ./.git/config
    - ./.github/workflows   # do not let agent edit CI
    - ~/.ssh
    - ~/.aws
    - ~/.config
    - ~/Library/Application Support
  block_outside_project: true
commands:
  auto_approve:
    - claude
    - codex
    - aider
    - goose
    - npm test
    - npm run test
    - npm run build
    - npm run lint
    - go test ./...
    - cargo test
    - pytest
    - git status
    - git diff
  require_approval:
    - npm install
    - pip install
    - cargo add
    - go get
    - git commit
    - git push
  block:
    - sudo
    - su
    - "rm -rf /"
    - "rm -rf ~"
    - "chmod -R 777"
    - chown -R
    - curl
    - wget
    - ssh
    - scp
    - nc
    - netcat
network:
  default: block
  allow_domains:
    - github.com
    - api.github.com
    - api.anthropic.com
    - api.openai.com
    - registry.npmjs.org
    - pypi.org
  require_approval_for_unknown_domains: true
git:
  protected_branches: [main, master, production]
  block_push_to_protected_branches: true
  require_secret_scan_before_commit: true
  require_secret_scan_before_push: true
  block_force_push: true
secrets:
  enabled: true
  scan_before_commit: true
  scan_before_push: true
  ignore_paths: [./node_modules, ./.git, ./dist, ./build, ./vendor]
  max_file_bytes: 1048576
audit:
  enabled: true
  log_dir: ./.meerkat/logs
  format: jsonl
  redact_secrets: true
approval:
  timeout_seconds: 120
  default_on_timeout: deny
  allow_session_approval: true
sandbox:
  enabled: false              # set true to wrap the agent in Seatbelt/bubblewrap
  backend: auto
  fail_closed: false
  egress:
    mode: off                 # set 'proxy' to force HTTPS through Meerkat
plugins:
  scanner: [gitleaks, trufflehog]   # active if installed
integrations:
  github:
    branch_protection_aware: true
    token_env: GITHUB_TOKEN
